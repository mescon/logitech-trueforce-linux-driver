# hid-logitech-dd module load ordering, and a narrow, targeted blacklist.
#
# A driver binds matching devices the moment it registers, so whichever of
# hid-logitech-dd and the in-tree hid-logitech / hid-logitech-hidpp
# registers first owns a G923 (c266/c267/c26e). These two lines make
# loading either in-tree module pull hid-logitech-dd in FIRST, so ours is
# registered by the time theirs looks for devices; a missing or unbuilt
# hid-logitech-dd is not an error, the in-tree module still loads.
#
# This matters beyond feature parity. When an in-tree driver has bound the
# wheel, udev/72-logitech-g923-rebind.rules unbinds it and binds ours, and
# the in-tree hid-logitech-hidpp cannot survive that unbind while any
# process holds the wheel's event node open (plymouth at boot, Steam or a
# game later): its force-feedback teardown runs when that process closes
# the node and touches memory the unbind already freed, a kernel oops
# (#90). Not letting it bind the wheel in the first place avoids that
# path; the rebind rule stays as the fallback for a module that was
# already loaded before this file could order anything.
#
# "pre" on the in-tree modules, not "post" on ours: "post" only ordered
# the in-tree modules after ours when ours was the one being loaded, and
# did nothing when udev asked for hid-logitech-hidpp directly.
softdep hid-logitech-hidpp pre: hid-logitech-dd
softdep hid-logitech pre: hid-logitech-dd

# hid-logitech-new is berarma's standalone "new-lg4ff" DKMS fork. It only
# drives wheels, never mice/keyboards/receivers, so blacklisting it here
# cannot break unrelated hardware the way blacklisting hid-logitech-hidpp
# would (that one also serves countless non-wheel Logitech devices - see
# README.md and tools/setup.sh). But new-lg4ff is not scoped to the G923:
# it also drives the G29, G27, DFGT, DFP and other older Logitech wheels.
# A user running it for one of those gets silently downgraded to the
# in-tree hid-logitech (lg4ff) driver for that wheel by this blacklist -
# hid-logitech-dd does not claim those PIDs, so nothing here replaces the
# functionality lost. That is an accepted tradeoff to keep c266/c267 from
# racing between the two forks; it is not "safe for everyone."
blacklist hid-logitech-new
