# Load uhid at boot. The logi-ffb DirectInput proxy creates its virtual
# wheel through /dev/uhid. That node is created root-only by kmod's
# static-nodes before any module loads, and the udev rule that opens it
# to the session user (71-logi-ffb-uhid.rules) only fires when the uhid
# device appears, which is when the module loads. On a system where
# nothing else loads it, the node stayed root-only for good (#105).
uhid
