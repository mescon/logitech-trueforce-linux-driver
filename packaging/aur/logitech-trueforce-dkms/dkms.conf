PACKAGE_NAME="logitech-trueforce"
PACKAGE_VERSION="@PKGVER@"
# Build against the `source` symlink DKMS always creates
# (-> /usr/src/$PACKAGE_NAME-$PACKAGE_VERSION). The `build` subdir DKMS
# also exposes is not guaranteed to be populated with the source files,
# which produced silent no-op builds where `dkms install` reported
# success but kept the old .ko (upstream issue #17).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/source modules"
# No CLEAN. dkms 3 reads it only to print a deprecation warning and never
# runs it, and dkms 2 falls back to `make clean`, which this Makefile
# implements. Building in `source` does leave objects behind between
# kernels; kbuild rebuilds them anyway, because the compiler command line
# carries the kernel build directory and a changed command line is what it
# compares against.
# The built object is hid-logitech-dd.ko - a distinct name from the
# in-tree hid-logitech-hidpp, which it does NOT replace: this driver
# claims only the direct-drive wheels and coexists with the in-tree
# driver (no blacklist needed). dkms passes LLVM=1 automatically on
# clang-built kernels.
BUILT_MODULE_NAME[0]="hid-logitech-dd"
BUILT_MODULE_LOCATION[0]="../source"
DEST_MODULE_NAME[0]="hid-logitech-dd"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
