name: cargo-audit
# Fails if any Rust dependency has a known advisory in the RustSec database.
on:
  push:
    branches: [master]
    paths:
      - 'userspace/logi-wheel/**/Cargo.toml'
      - 'userspace/logi-wheel/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: userspace/logi-wheel
        run: cargo audit
