name: logi-wheel
on:
  # Manually runnable. GitHub does not retroactively run workflows for
  # pushes made while Actions was down, so after the outage of 2026-08-06
  # there was no way to get CI onto the current commit except an empty
  # commit purely to trigger it. This is that way.
  workflow_dispatch:
  push:
    # tools/ is here for the committed-binaries checks below: the relay
    # and both proxy DLLs live there with their sources, and a push that
    # touches only tools/ used to trigger no freshness check at all.
    paths: ["userspace/logi-wheel/**", "tools/**", ".github/workflows/logi-wheel.yml"]
  # Unfiltered on pull requests: these checks are required by the branch
  # protection, and a required check that never runs blocks the merge.
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: userspace/logi-wheel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies (logi-wheel-gui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        run: cargo test --workspace --locked --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A binary asks for whatever glibc symbol versions the build host
      # offered, so one built here can refuse to start on a distribution
      # whose glibc is older, SteamOS among them (issue #68). Checked on
      # the release profile because that is what ships.
      - name: Build the shipped binaries
        run: cargo build --workspace --locked --release
      - name: Every lookup of our staged files must survive a prefix install
        working-directory: ${{ github.workspace }}
        run: tools/check-share-lookups.sh
      - name: The binaries must run on an older glibc
        working-directory: ${{ github.workspace }}
        run: |
          # The truck-sim plugin is in this list for a reason: it is
          # dlopened by the game, so a version it cannot satisfy would
          # make the sim skip it in silence, with nothing for the owner
          # to act on.
          cc -O2 -Wall -o /tmp/logi-rpm-bridge tools/logi-rpm-bridge.c
          tools/check-glibc-floor.sh \
            userspace/logi-wheel/target/release/logi-wheel-gui \
            userspace/logi-wheel/target/release/logi-wheel \
            userspace/logi-wheel/target/release/logi-tf-sim \
            userspace/logi-wheel/target/release/logi-ffb \
            userspace/logi-wheel/target/release/liblogi_tf_scs.so \
            /tmp/logi-rpm-bridge

  # logi-tf-relay is a Windows executable that runs inside the game's Proton
  # prefix, so everything that actually talks to shared memory sits behind
  # cfg(windows) and the job above never compiles a line of it. That gap let
  # untranslated strings and an unbounded read ship unnoticed, and it means
  # the decoders' whole calling path was unverified. This job is the only
  # thing that compiles the code users run.
  relay-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: userspace/logi-wheel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The freshness check below walks each file's history. With the
          # default depth-1 snapshot every path dates to the same single
          # commit, so the check could never fire.
          fetch-depth: 0
      - name: Install the MinGW linker
        # The windows-gnu target links with MinGW; without it every build
        # here fails at the link step rather than on anything we wrote.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Install Rust with the Windows target
        run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-gnu
      - name: Build the relay for Windows
        run: cargo build -p logi-tf-relay --locked --target x86_64-pc-windows-gnu --verbose
      - name: Clippy the relay for Windows
        run: cargo clippy -p logi-tf-relay --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      # The build above is the one way this project has of producing the
      # relay when no contributor machine has the Windows target: after a
      # source change, download this artifact, run
      # tools/check-committed-dlls.sh's sibling check by committing it as
      # tools/logi-tf-relay.exe, and the staleness check below passes on
      # the next push. Uploaded before that check so a stale commit still
      # yields the fresh binary it needs.
      - name: Build the relay as it ships (relay-dist profile)
        run: cargo build --profile relay-dist --locked -p logi-tf-relay --target x86_64-pc-windows-gnu
      - name: Keep the freshly built relay as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logi-tf-relay-${{ github.sha }}
          path: userspace/logi-wheel/target/x86_64-pc-windows-gnu/relay-dist/logi-tf-relay.exe
          if-no-files-found: error
      - name: The committed relay binary must not be older than its sources
        # Packaging installs tools/logi-tf-relay.exe, because no distro
        # builder can produce a Windows binary. A prebuilt artifact is only
        # safe if something notices when it falls behind the code.
        working-directory: ${{ github.workspace }}
        run: tools/build-relay.sh --check

  # The other two committed Windows binaries, with the relay's promise:
  # tf-range-proxy.dll (the 90-degree fix and the G923 TrueForce carry)
  # and dinput8-escape.dll (the SDK range answers and the texture merge's
  # RPM relay) ship prebuilt from tools/, and a source edit without a
  # rebuilt DLL must fail CI rather than ship stale behaviour.
  #
  # This compares commit ages, like build-relay.sh --check, rather than
  # rebuilding with mingw and byte-comparing: PE byte reproducibility
  # holds only on the toolchain that built the committed copy (the same
  # gcc 16.1.0 from two distros differs in a third of the file, and
  # Ubuntu's mingw 13 changes the size; measured 2026-08-14, recorded in
  # the check script's header). The byte-level check exists as
  # `tools/check-committed-dlls.sh --verify-bytes`, run on the machine
  # that rebuilds a DLL, before committing it.
  committed-dlls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check walks each file's history; the default depth-1
          # snapshot would date every path to the same commit and wave
          # everything through.
          fetch-depth: 0
      - name: The committed proxy DLLs must not be older than their sources
        run: tools/check-committed-dlls.sh --check
      - name: The DKMS packaging manifests must stage every included header
        # A header added to mainline/ without a manifest update ships a
        # source tree that fails at install time on the user's machine,
        # invisible to CI (issue #64).
        run: tools/check-packaging-sources.sh

  # The Rust workspace's statement coverage, measured with cargo-llvm-cov and
  # printed in the job summary. Informational: it is what the documentation
  # quotes, and a drop below 80% is something to see, not something to block
  # a fix on. libtrueforce is built here first so the daemon links against a
  # copy made with this runner's toolchain.
  coverage:
    name: Coverage (Rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev
      - run: cargo install cargo-llvm-cov --locked
      - run: make -C userspace/libtrueforce libtrueforce.a
      - name: Measure
        working-directory: userspace/logi-wheel
        run: |
          cargo llvm-cov --workspace --locked --summary-only 2>&1 | tee coverage.txt
          { echo '## Statement coverage (cargo-llvm-cov, whole workspace)'; echo; echo '```'; tail -3 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: userspace/logi-wheel/coverage.txt

  # A CycloneDX SBOM per crate, from the locked dependency graph. Built on
  # every push so the step is known to work before a release depends on it;
  # the release pipeline runs the same command and attaches the result.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate
        working-directory: userspace/logi-wheel
        run: |
          cargo cyclonedx -a -f json --locked
          mkdir -p sbom
          for f in crates/*/*.cdx.json; do mv "$f" "sbom/$(basename "$f")"; done
          ls -1 sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: userspace/logi-wheel/sbom/
